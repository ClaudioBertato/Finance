<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fondo Pensione</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #11182c;
      --panel-2: #16203a;
      --border: rgba(255,255,255,.08);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --purple: #a855f7;
      --shadow: 0 20px 60px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 10%, rgba(168,85,247,.14), transparent 28%), var(--bg);
      color: var(--text);
    }
    .container { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
    .eyebrow { color: var(--purple); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 0; font-size: clamp(30px, 4vw, 46px); line-height: 1.05; }
    .subtitle { max-width: 560px; margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .back-link, button { border: 0; border-radius: 10px; padding: 10px 14px; color: #08111f; background: var(--accent); font: inherit; font-size: 13px; font-weight: 800; text-decoration: none; cursor: pointer; }
    .panel { padding: 24px; background: rgba(17,24,44,.84); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
    label { display: grid; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    input { width: 100%; padding: 13px; color: var(--text); background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: 18px; font-weight: 800; }
    input:focus { outline: none; border-color: var(--purple); }
    .note { margin-top: 16px; padding: 14px; border: 1px solid var(--border); border-radius: 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .status { min-height: 20px; margin-top: 12px; color: var(--muted); font-size: 12px; }
    @media (max-width: 700px) { header { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <div class="eyebrow">Wealth Strategy · Previdenza</div>
        <h1>Fondo Pensione</h1>
        <p class="subtitle">Inserisci il capitale attuale del fondo. Il simulatore userà esclusivamente questo valore.</p>
      </div>
      <a class="back-link" href="simulatorePatrimonio.html">Torna al simulatore</a>
    </header>

    <section class="panel">
      <label for="pensionAmount">Importo totale fondo pensione (€)</label>
      <input id="pensionAmount" type="number" min="0" step="100" placeholder="0" />
      <div class="note">Questa pagina registra soltanto il capitale inserito. Non viene applicato alcun rendimento automatico.</div>
      <div class="status" id="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "sim_pensionFund";
    const amountInput = document.getElementById("pensionAmount");
    const status = document.getElementById("status");
    amountInput.value = Number(localStorage.getItem(STORAGE_KEY) || 0);

    function savePensionFund() {
      const amount = Math.max(0, Number(amountInput.value) || 0);
      localStorage.setItem(STORAGE_KEY, String(amount));
      status.textContent = "Valore salvato automaticamente.";
    }

    amountInput.addEventListener("input", savePensionFund);
    savePensionFund();
  </script>
</body>
</html>
